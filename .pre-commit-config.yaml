repos:
  - repo: local
    hooks:
      - id: prettier
        name: json/yaml/markdown - prettier check
        entry: npx --yes prettier@3 --check
        language: system
        files: \.(json|ya?ml|md)$
      - id: stylua
        name: lua - stylua check
        entry: stylua --check
        language: system
        types: [lua]
      - id: shfmt
        name: bash - shfmt check
        entry: shfmt --diff
        language: system
        types: [shell]
